# Render Blueprint. On render.com -> New -> Blueprint -> point at your repo.
# Render reads this file and creates the web service automatically.
services:
  - type: web
    name: networkiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GMI_API_KEY
        sync: false            # you paste this secret in the Render dashboard
      - key: GMI_BASE_URL
        value: https://api.gmi-serving.com/v1
      - key: GMI_MODEL
        value: openai/gpt-oss-120b
      # Set DEMO_MODE to "1" if you ever want the live site to force demo data.
      - key: DEMO_MODE
        value: "0"
